<html lang="en">

  <meta name="description" content="A complete offline-first rural telemedicine platform with AI triage confidence scoring, urgent escalation, multilingual support, and medicine/vaccine inventory tracking." />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM (Production UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom subtle animations */
    @keyframes pulse-fast {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .animate-pulse-fast {
      animation: pulse-fast 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">

        thermometer: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />,
        truck: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0zM13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0" />,
        printer: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4H7v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />,
        globe: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />,

      return (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" {...props}>

    };

    // --- MULTILINGUAL TRANSLATIONS DICTIONARY ---
    const LANGUAGES = [
      { code: "en", name: "English", native: "English" },
      { code: "hi", name: "Hindi", native: "हिन्दी" },
      { code: "bn", name: "Bengali", native: "বাংলা" },
      { code: "mr", name: "Marathi", native: "मराठी" },
      { code: "te", name: "Telugu", native: "తెలుగు" },
      { code: "ta", name: "Tamil", native: "தமிழ்" },
      { code: "es", name: "Spanish", native: "Español" },
      { code: "sw", name: "Swahili", native: "Kiswahili" },
    ];

    const UI_TEXT = {
      en: {
        appTitle: "ArogyaSeva: Rural Outreach & Telemedicine",
        hwPortal: "Health Worker Portal (Field)",
        docPortal: "Doctor Telemedicine Desk",
        invPortal: "Medicine & Vaccine Stock",
        bidPortal: "Solution Bid & Technical Blueprint",
        urgentEscalation: "🚨 Flag as URGENT Escalation",
        runAiTriage: "Run AI Triage & Confidence Assessment",
        saveRecord: "Save & Queue Patient (Offline / Online)",
        connectDoctor: "Connect Telemedicine Doctor",
      },
      hi: {
        appTitle: "आरोग्यसेवा: ग्रामीण स्वास्थ्य एवं टेलीमेडिसिन",
        hwPortal: "स्वास्थ्य कार्यकर्ता पोर्टल (आशा)",
        docPortal: "डॉक्टर टेलीमेडिसिन डेस्क",
        invPortal: "दवा एवं टीका भंडार",
        bidPortal: "प्रोजेक्ट प्रस्ताव एवं रूपरेखा",
        urgentEscalation: "🚨 आपातकालीन / गंभीर स्थिति घोषित करें",
        runAiTriage: "एआई नैदानिक आकलन एवं जोखिम जांच",
        saveRecord: "मरीज का रिकॉर्ड सुरक्षित करें",
        connectDoctor: "डॉक्टर से वीडियो/ऑडियो परामर्श शुरू करें",
      }
    };

    // --- INITIAL MOCK DATA ---
    const INITIAL_PATIENTS = [
      {
        id: "pat-101",
        nationalId: "IN-VIL-9428-11",
        name: "Sunita Devi",
        age: 29,
        gender: "Female",
        village: "Village Rampur (North Ridge)",
        subCenter: "Rampur Sub-Health Center #3",
        contactNumber: "+91 98765 43210",
        allergies: ["Penicillin"],
        chronicConditions: ["Anemia (mild)"],
        currentSymptoms: ["High Fever", "Severe Chills", "Body Aches", "Severe Headache"],

          urgency: "CRITICAL",
          urgencyReason: "Endemic zone + severe temperature spike and low SpO2.",
          differentialDiagnoses: [
            { condition: "Plasmodium Falciparum Malaria", probability: 82, reasoning: "Rigors and periodic chills." },

          ],

        }
      },
      {
        id: "pat-102",

        name: "Rameshwar Patel",
        age: 64,
        gender: "Male",

        subCenter: "Sundarpur Rural Dispensary",

        symptomNotes: "Severe hypoxemia (SpO2 88%). Patient in tripod posture gasping.",
        isUrgent: true,

          ],

        }
      },
      {
        id: "pat-105",
        nationalId: "IN-VIL-5529-61",
        name: "Balwan Singh",
        age: 42,
        gender: "Male",
        village: "Village Dholakpur",

        chronicConditions: ["None"],
        currentSymptoms: ["Bite Marks on Ankle", "Localized Swelling", "Numbness in Leg"],
        primaryComplaint: "Suspected snake bite while working in sugarcane field 45 mins ago",
        symptomDuration: "45 minutes",

        symptomNotes: "Two puncture wounds on right ankle with rapid local edema.",

          ],
          actions: ["Immobilize limb with splint", "Perform 20-min Whole Blood Clotting Test", "Check Anti-Snake Venom stock"]
        }
      }
    ];

    const INITIAL_INVENTORY = [
      { id: "med-01", name: "Paracetamol 500mg Tablets", category: "Medicine", quantity: 420, unit: "Tablets", minThreshold: 500, batch: "PCM-2026-88B", expiry: "2027-11-30" },
      { id: "med-02", name: "Amoxicillin 500mg Capsules", category: "Medicine", quantity: 180, unit: "Capsules", minThreshold: 300, batch: "AMX-2025-41C", expiry: "2027-04-15" },
      { id: "med-03", name: "Oral Rehydration Salts (ORS)", category: "Medicine", quantity: 780, unit: "Sachets", minThreshold: 250, batch: "ORS-2026-10", expiry: "2028-06-30" },
      { id: "med-04", name: "Polyvalent Anti-Snake Venom (ASV) 10ml", category: "Emergency Kit", quantity: 3, unit: "Vials", minThreshold: 10, batch: "ASV-2026-09", expiry: "2027-08-20", coldChain: "2°C - 8°C" },
      { id: "med-05", name: "Rabies Vaccine (Cell Culture ARV)", category: "Vaccine", quantity: 12, unit: "Vials", minThreshold: 20, batch: "RBV-2026-14", expiry: "2027-03-31", coldChain: "2°C - 8°C" },
      { id: "med-06", name: "Pentavalent Vaccine (DTP-HepB-Hib)", category: "Vaccine", quantity: 8, unit: "Vials", minThreshold: 25, batch: "PTV-2026-52", expiry: "2027-09-15", coldChain: "2°C - 8°C" },
      { id: "med-07", name: "Bivalent Oral Polio Vaccine (bOPV)", category: "Vaccine", quantity: 140, unit: "Doses", minThreshold: 50, batch: "OPV-2026-90", expiry: "2027-12-31", coldChain: "2°C - 8°C" },
    ];

    // --- ROOT APP COMPONENT ---
    function App() {
      const [role, setRole] = useState("health_worker"); // health_worker, doctor, inventory, bid
      const [network, setNetwork] = useState("online"); // online, poor_2g, offline
      const [lang, setLang] = useState("en");
      const [patients, setPatients] = useState(INITIAL_PATIENTS);
      const [selectedPatId, setSelectedPatId] = useState("pat-101");
      const [inventory, setInventory] = useState(INITIAL_INVENTORY);
      const [teleconsultPat, setTeleconsultPat] = useState(null);
      const [activeRx, setActiveRx] = useState(null);
      const [syncQueue, setSyncQueue] = useState([]);
      const [isSyncing, setIsSyncing] = useState(false);

      const selectedPatient = patients.find(p => p.id === selectedPatId) || patients[0];
      const lowStockCount = inventory.filter(i => i.quantity <= i.minThreshold).length;
      const criticalCount = patients.filter(p => p.isUrgent && p.status !== "consulted").length;

      // Rule-based Local AI Triage
      const calculateLocalTriage = (pat) => {
        const spo2 = parseFloat(pat.vitals.spo2 || "98");
        const temp = parseFloat(pat.vitals.temp || "98.6");
        const isCritical = spo2 < 90 || temp >= 103 || pat.currentSymptoms.some(s => s.toLowerCase().includes("snake") || s.toLowerCase().includes("breath"));
        return {
          preliminaryAssessment: isCritical ? "Acute Emergency Presentation" : "Acute Symptomatic Episode",
          confidenceScore: isCritical ? 92 : 84,
          urgency: isCritical ? "CRITICAL" : "MODERATE",
          urgencyReason: isCritical ? `Life-threatening parameter flagged (SpO2: ${spo2}%, Temp: ${temp}°F)` : "Stable baseline vitals with moderate complaint.",
          differentialDiagnoses: [
            { condition: "Primary Suspected Condition", probability: 82, reasoning: "Clinical vitals correlation" },
            { condition: "Secondary Infection Risk", probability: 45, reasoning: "Seasonal endemic prevalence" }
          ],
          actions: ["Keep patient in semi-fowler resting posture", "Monitor oxygenation every 15 mins", "Emergency Teleconsultation"]
        };
      };

      const handleSaveIntake = (updated) => {
        setPatients(prev => prev.map(p => p.id === updated.id ? updated : p));
        if (network !== "online") {
          setSyncQueue(prev => [{ id: Date.now(), item: updated.name, time: new Date().toLocaleTimeString() }, ...prev]);
        }
        alert("Patient record saved successfully! (Stored in LocalStorage outbox)");
      };

      const triggerSync = () => {
        if (network === "offline") return;
        setIsSyncing(true);
        setTimeout(() => {
          setSyncQueue([]);
          setIsSyncing(false);
          alert("Offline queue synchronized with District Health Server!");
        }, 1200);
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Header */}
          <header className="sticky top-0 z-40 bg-white border-b border-slate-200 shadow-sm">
            {criticalCount > 0 && (
              <div className="bg-red-600 text-white px-4 py-1.5 text-xs flex items-center justify-between font-semibold animate-pulse">
                <span className="flex items-center gap-1.5">
                  <Icon name="alertTriangle" className="w-4 h-4" />
                  EMERGENCY BROADCAST: {criticalCount} critical patients flagged in remote village sub-centers!
                </span>
                <span className="bg-red-800 px-2 py-0.5 rounded text-[10px]">Active Triage Priority</span>
              </div>
            )}

            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center shadow-md">
                  <Icon name="activity" className="w-6 h-6" />
                </div>
                <div>
                  <h1 className="font-extrabold text-slate-900 text-base sm:text-lg tracking-tight">
                    ArogyaSeva TeleHealth
                  </h1>
                  <p className="text-[11px] text-slate-500 hidden sm:block">
                    Rural Healthcare Outreach &amp; Telemedicine Support Platform
                  </p>
                </div>
              </div>

              {/* Network & Outbox Controls */}
              <div className="flex items-center gap-2 text-xs">
                <div className="bg-slate-100 p-1 rounded-lg border border-slate-200 flex items-center">
                  <button
                    onClick={() => setNetwork("online")}
                    className={`px-2 py-1 rounded font-semibold ${network === "online" ? "bg-emerald-600 text-white" : "text-slate-600"}`}
                  >
                    Online
                  </button>
                  <button
                    onClick={() => setNetwork("poor_2g")}
                    className={`px-2 py-1 rounded font-semibold ${network === "poor_2g" ? "bg-amber-600 text-white" : "text-slate-600"}`}
                  >
                    2G Slow
                  </button>
                  <button
                    onClick={() => setNetwork("offline")}
                    className={`px-2 py-1 rounded font-semibold ${network === "offline" ? "bg-rose-600 text-white" : "text-slate-600"}`}
                  >
                    Offline
                  </button>
                </div>

                <button
                  onClick={triggerSync}
                  disabled={network === "offline" || syncQueue.length === 0}
                  className={`px-3 py-1.5 rounded-lg border font-semibold flex items-center gap-1.5 ${
                    syncQueue.length > 0 ? "bg-amber-50 text-amber-900 border-amber-300" : "bg-slate-50 text-slate-600 border-slate-200"
                  }`}
                >
                  <Icon name="refresh" className={`w-3.5 h-3.5 ${isSyncing ? "animate-spin" : ""}`} />
                  <span>{syncQueue.length > 0 ? `${syncQueue.length} Outbox` : "Synced"}</span>
                </button>

                <select
                  value={lang}
                  onChange={(e) => setLang(e.target.value)}
                  className="bg-slate-100 border border-slate-200 text-xs rounded-lg px-2 py-1.5 font-medium"
                >
                  {LANGUAGES.map(l => <option key={l.code} value={l.code}>{l.native}</option>)}
                </select>
              </div>
            </div>

            {/* Role Navigation Bar */}
            <div className="border-t border-slate-200 px-4 max-w-7xl mx-auto flex space-x-2 overflow-x-auto no-scrollbar">
              <button
                onClick={() => setRole("health_worker")}
                className={`py-2 px-3 text-xs sm:text-sm font-bold border-b-2 transition flex items-center gap-1.5 ${
                  role === "health_worker" ? "border-emerald-600 text-emerald-700 bg-emerald-50/50" : "border-transparent text-slate-600"
                }`}
              >
                <Icon name="users" className="w-4 h-4 text-emerald-600" />
                <span>Health Worker (Field)</span>
              </button>

              <button
                onClick={() => setRole("doctor")}
                className={`py-2 px-3 text-xs sm:text-sm font-bold border-b-2 transition flex items-center gap-1.5 ${
                  role === "doctor" ? "border-blue-600 text-blue-700 bg-blue-50/50" : "border-transparent text-slate-600"
                }`}
              >
                <Icon name="stethoscope" className="w-4 h-4 text-blue-600" />
                <span>Doctor Telemedicine Desk</span>
                {criticalCount > 0 && <span className="bg-red-600 text-white text-[10px] px-1.5 rounded-full">{criticalCount}</span>}
              </button>

              <button
                onClick={() => setRole("inventory")}
                className={`py-2 px-3 text-xs sm:text-sm font-bold border-b-2 transition flex items-center gap-1.5 ${
                  role === "inventory" ? "border-indigo-600 text-indigo-700 bg-indigo-50/50" : "border-transparent text-slate-600"
                }`}
              >

                      <tr><td className="p-2.5 font-bold">Field Rugged Hardware</td><td className="p-2.5">100 Android Tablets, Solar Power Banks, Bluetooth SpO2/BP Cuffs</td><td className="p-2.5 text-right font-bold">$32,000</td></tr>
                      <tr><td className="p-2.5 font-bold">Cold-Chain IoT Probes</td><td className="p-2.5">LoRaWAN / GSM Refrigerator probes with battery backup</td><td className="p-2.5 text-right font-bold">$8,500</td></tr>
                      <tr><td className="p-2.5 font-bold">Health Worker Training</td><td className="p-2.5">Field training in regional languages for 150 ASHA nurses</td><td className="p-2.5 text-right font-bold">$12,000</td></tr>
                      <tr className="bg-slate-50 font-bold text-purple-950"><td className="p-2.5" colSpan="2">Estimated Turnkey Pilot Total</td><td className="p-2.5 text-right text-sm text-purple-700">$70,500</td></tr>
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>

          {/* TELECONSULTATION CALL MODAL */}
          {teleconsultPat && (
            <div className="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl w-full max-w-4xl p-6 text-white space-y-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <div>
                    <h3 className="font-bold text-sm">Live Teleconsultation: {teleconsultPat.name}</h3>
                    <p className="text-xs text-slate-400">Village: {teleconsultPat.village} · ASHA Terminal Active</p>
                  </div>
                  <button onClick={() => setTeleconsultPat(null)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="aspect-video bg-slate-950 rounded-2xl border border-slate-800 flex flex-col items-center justify-center text-xs">
                    <div className="w-12 h-12 rounded-full bg-emerald-900/50 border border-emerald-500 flex items-center justify-center text-lg font-bold text-emerald-300 mb-2">
                      {teleconsultPat.name.charAt(0)}
                    </div>
                    <span>{teleconsultPat.name} &amp; ASHA Nurse</span>
                    <span className="text-[10px] text-slate-400 mt-1">SpO2: {teleconsultPat.vitals.spo2}% · Temp: {teleconsultPat.vitals.temp}°F</span>
                  </div>

                  <div className="aspect-video bg-slate-950 rounded-2xl border border-slate-800 flex flex-col items-center justify-center text-xs">
                    <div className="w-12 h-12 rounded-full bg-blue-900/50 border border-blue-500 flex items-center justify-center text-lg font-bold text-blue-300 mb-2">
                      Dr
                    </div>
                    <span>Dr. Ananya Sen, MD</span>
                    <span className="text-[10px] text-blue-400 mt-1">District Outreach Tele-Physician</span>
                  </div>
                </div>

                <div className="flex justify-between items-center pt-2">
                  <span className="text-xs text-slate-400">Connection: WebRTC 2G Low-Latency Audio Enabled</span>
                  <button
                    onClick={() => {
                      alert("Consultation complete! Prescription saved to patient history.");
                      setTeleconsultPat(null);
                    }}
                    className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-5 py-2 rounded-xl shadow"
                  >
                    Complete Call &amp; Issue e-Prescription
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* e-PRESCRIPTION PRINT/VIEW MODAL */}
          {activeRx && (
            <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white text-slate-900 rounded-3xl w-full max-w-xl p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-start border-b pb-3">
                  <div>
                    <h3 className="font-bold text-base text-emerald-900">District Telemedicine Health Network</h3>
                    <p className="text-xs text-slate-500">Official Electronic Prescription (e-Rx)</p>
                  </div>
                  <button onClick={() => setActiveRx(null)} className="text-slate-400 font-bold">✕</button>
                </div>

                <div className="text-xs space-y-2">
                  <div className="flex justify-between">
                    <div>
                      <span className="font-bold block">{activeRx.doctor}</span>
                      <span className="text-slate-500">District Hospital Telemedicine Wing</span>
                    </div>
                    <div className="text-right">
                      <span className="font-bold block">{activeRx.patient.name} ({activeRx.patient.age}y)</span>
                      <span className="text-slate-500">{activeRx.patient.village}</span>
                    </div>
                  </div>

                  <div className="bg-slate-50 p-3 rounded-xl border">
                    <span className="font-bold block text-slate-800">Diagnosis: {activeRx.diagnosis}</span>
                    <span className="text-slate-500 text-[11px]">Vitals: SpO2 {activeRx.patient.vitals.spo2}%, Temp {activeRx.patient.vitals.temp}°F, BP {activeRx.patient.vitals.bp}</span>
                  </div>

                  <div className="space-y-1">
                    <span className="font-bold block text-slate-700 uppercase tracking-wider text-[10px]">Prescribed Medications:</span>
                    {activeRx.rx.map((r, i) => (
                      <div key={i} className="p-2 bg-emerald-50/50 border border-emerald-100 rounded-lg text-xs font-semibold text-emerald-900">
                        {i + 1}. {r}
                      </div>
                    ))}
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-3 border-t">
                  <button onClick={() => setActiveRx(null)} className="px-4 py-2 text-xs font-semibold text-slate-600">Close</button>
                  <button onClick={() => window.print()} className="bg-emerald-600 text-white font-bold text-xs px-4 py-2 rounded-xl shadow">Print / Save PDF</button>
                </div>
              </div>
            </div>
          )}

          {/* Persistent Footer */}
          <footer className="mt-auto border-t border-slate-200 bg-white py-3 px-4 text-xs text-slate-500">
            <div className="max-w-7xl mx-auto flex justify-between items-center">
              <span>ArogyaSeva TeleHealth · Offline-First Rural Outreach Platform</span>
              <span className="text-emerald-600 font-semibold">● PWA Ready · Zero Data Loss Architecture</span>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
